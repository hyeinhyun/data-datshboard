[project]
name = "hf-worker"
version = "0.1.0"
description = "HuggingFace dataset -> LLaVA JSON conversion worker for the data dashboard"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "huggingface_hub[cli]>=0.26",
    "pillow>=10.0",
    "pyarrow>=15.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hf_worker"]
